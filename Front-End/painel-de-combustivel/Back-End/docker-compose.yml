version: '3.8'

services:
  db:
    image: postgres:15
    container_name: go_db
    restart: always
    environment:
      POSTGRES_USER: roger_user
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: Produtos
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data: